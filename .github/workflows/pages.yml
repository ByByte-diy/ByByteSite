name: GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate lessons index
        run: node scripts/generate-index.js

      - name: Generate prerender routes
        run: |
          npm run generate-prerender-routes
          echo "Prerender routes generated:"
          cat prerendered-routes.txt

      - name: Lint code
        run: npm run lint

      - name: Run tests
        run: npm run test -- --watch=false --browsers=ChromeHeadless

      - name: Build for GitHub Pages
        run: npm run build:gh
        env:
          NODE_ENV: production

      - name: Generate sitemap
        run: |
          npm run generate-sitemap
          if [ -f "dist/ByByteSite/browser/sitemap.xml" ]; then
            echo "Sitemap generated successfully"
          else
            echo "Sitemap.xml not found"
          fi

      - name: Create 404.html for GitHub Pages
        run: |
          cp dist/ByByteSite/browser/index.html dist/ByByteSite/browser/404.html
          printf 'www.bybyte.diy\n' > dist/ByByteSite/browser/CNAME

      - name: Verify content files
        run: |
          if [ -f "dist/ByByteSite/browser/assets/content/index.json" ]; then
            echo "Content index.json found in build output"
            ls -la dist/ByByteSite/browser/assets/content/
          else
            echo "WARNING: Content index.json not found in build output"
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/ByByteSite/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
