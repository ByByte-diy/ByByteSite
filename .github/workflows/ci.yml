name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write
  issues: write

env:
  NODE_VERSION: "22"

jobs:
  content-validation:
    runs-on: ubuntu-latest
    outputs:
      content-valid: ${{ steps.validate.outputs.valid }}
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate lessons index
        run: node scripts/generate-index.js

      - name: Validate content structure
        id: validate
        run: |
          node scripts/validate-content.js
          echo "valid=true" >> $GITHUB_OUTPUT

  build-and-test:
    runs-on: ubuntu-latest
    needs: content-validation
    if: needs.content-validation.outputs.content-valid == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate lessons index
        run: node scripts/generate-index.js

      - name: Generate prerender routes
        run: |
          npm run generate-prerender-routes
          echo "Prerender routes generated:"
          cat prerendered-routes.txt

      - name: Lint code
        run: npm run lint

      - name: Run tests
        run: npm run test -- --watch=false --browsers=ChromeHeadless

      - name: Build application
        run: npm run build:gh
        env:
          NODE_ENV: production

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: dist/
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: [content-validation, build-and-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-files
          path: dist/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/ByByteSite/browser

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  preview-deploy:
    runs-on: ubuntu-latest
    needs: [content-validation, build-and-test]
    if: github.event_name == 'pull_request'
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-files
          path: dist/

      - name: Deploy preview
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/ByByteSite/browser
          destination_dir: preview/pr-${{ github.event.number }}

      - name: Preview deployed notification
        run: |
          echo "Preview deployed!"
          echo "Preview URL: https://www.bybyte.diy/preview/pr-${{ github.event.number }}/"
