name: Update Lessons Submodule

on:
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Force commit even if submodule pointer unchanged'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '22'

jobs:
  bump-submodule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get current submodule commit
        id: current
        run: |
          CURRENT=$(git rev-parse HEAD:submodules/ByByteLessons)
          echo "commit=$CURRENT" >> $GITHUB_OUTPUT
          echo "Current submodule commit: $CURRENT"

      - name: Update submodule to latest
        run: |
          git submodule update --remote --merge submodules/ByByteLessons
          LATEST=$(git rev-parse HEAD:submodules/ByByteLessons)
          echo "LATEST=$LATEST" >> $GITHUB_ENV
          echo "Latest submodule commit: $LATEST"

      - name: Check if update is needed
        id: update-check
        run: |
          if [ "${{ steps.current.outputs.commit }}" != "$LATEST" ] || [ "${{ github.event.inputs.force_update }}" = "true" ]; then
            echo "update_needed=true" >> $GITHUB_OUTPUT
          else
            echo "update_needed=false" >> $GITHUB_OUTPUT
            echo "Submodule already up to date"
          fi

      - name: Generate and validate content
        if: steps.update-check.outputs.update_needed == 'true'
        run: |
          node scripts/generate-index.js
          node scripts/validate-content.js

      - name: Commit and push submodule bump
        if: steps.update-check.outputs.update_needed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add submodules/ByByteLessons
          git commit -m "chore: bump ByByteLessons submodule to $LATEST"
          git push
